name: CI & DevSecOps Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Security audit settimanale ogni lunedì alle 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. DevSecOps Secret Scanning & Dependency Vulnerabilities
  # ----------------------------------------------------------------------------
  security-audit:
    name: DevSecOps Secret & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Rust Security Audit (RustSec Advisory Database)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: daemon

  # ----------------------------------------------------------------------------
  # 2. Rust Daemon Quality, Linting & Tests
  # ----------------------------------------------------------------------------
  rust-ci:
    name: Rust Host Daemon (Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Check Formatting (rustfmt)
        run: |
          cd daemon
          cargo fmt --all -- --check

      - name: SAST Linting (clippy)
        run: |
          cd daemon
          cargo clippy --all-targets -- -D warnings

      - name: Run Daemon Tests
        run: |
          cd daemon
          cargo test --all-targets --verbose

  # ----------------------------------------------------------------------------
  # 3. Flutter Android App Quality, Linting & Tests
  # ----------------------------------------------------------------------------
  flutter-ci:
    name: Flutter Mobile (Analyze & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Check Formatting (dart format)
        run: |
          cd mobile
          dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis (flutter analyze)
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

      - name: Run Widget & Unit Tests
        run: |
          cd mobile
          flutter test --no-pub --coverage
