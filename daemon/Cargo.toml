[package]
name = "onecontrol-daemon"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
evdev = "0.12"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
hostname = "0.4"
dirs = "5.0"
notify-rust = "4.11"
