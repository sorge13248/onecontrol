<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18112c" />
      <stop offset="100%" stop-color="#0a0714" />
    </linearGradient>
    <linearGradient id="primary-grad-2" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
