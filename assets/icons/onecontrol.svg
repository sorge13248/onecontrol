  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad-2)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#primary-grad-2)" stroke-width="1.5" stroke-opacity="0.3"/>

